name: csnl-ops · Milestone-Meeting slides chase

on:
  schedule:
    # Friday 14:00 KST = Friday 05:00 UTC.
    - cron: "0 5 * * 5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/chase-mm-slides
        env:
          URL: ${{ secrets.CSNL_OPS_VERCEL_URL }}/api/cron/chase-mm-slides
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET missing"; exit 1; fi
          if [ -z "$URL" ];          then echo "::error::CSNL_OPS_VERCEL_URL missing"; exit 1; fi
          status=$(curl -sS -o /tmp/r -w "%{http_code}" -X POST "$URL" -H "x-cron-secret: $CRON_SECRET")
          echo "HTTP $status"; cat /tmp/r || true; echo
          [ "$status" = "200" ] || { echo "::error::chase-mm-slides returned HTTP $status"; exit 1; }
